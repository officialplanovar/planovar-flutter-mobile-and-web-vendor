name: planovar_vendor
description: "Planovar Vendor — the vendor-side app for the Planovar event marketplace."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  dio: ^5.9.2
  socket_io_client: ^3.1.2
  livekit_client: ^2.4.0
  shared_preferences: ^2.5.5
  go_router: ^17.2.3
  flutter_secure_storage: ^10.2.0
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  equatable: ^2.0.8
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.0
  pin_code_fields: ^8.0.1
  country_picker: ^2.0.20
  fl_chart: ^0.70.2
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  app_links: ^6.3.2
  permission_handler: ^11.3.1
  flutter_svg: ^2.0.10+1
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/images/logo/
    - assets/icons/
